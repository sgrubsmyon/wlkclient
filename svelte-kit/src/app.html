<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// Apply the stored theme before first paint to avoid a flash. The cookie
			// follows the user's preference across devices (set at login).
			try {
				const cookie = document.cookie.match(/(?:^|; )theme=(dark|light)/);
				const theme = cookie ? cookie[1] : localStorage.getItem('theme');
				document.body.dataset.theme = theme === 'dark' ? 'dark' : 'light';
			} catch {}
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
